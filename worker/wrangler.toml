name = "receiptflow-api"
main = "src/index.ts"
compatibility_date = "2024-09-11"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "receiptflow-db"
database_id = ""

# Environment variables
[vars]
JWT_SECRET = ""
JWT_EXPIRY = "7d"
APP_URL = "https://receiptflow.pages.dev"

# Limits
[limits]
cpu_ms = 50000